{{- /*
平台密钥 Secret：主密钥、DB 密码、S3 密钥、模型网关密钥。
指定 secrets.existingSecret 时不创建（由用户自备同名键的 Secret）。
*/ -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apolla.secretName" . }}
  labels:
    {{- include "apolla.labels" . | nindent 4 }}
type: Opaque
stringData:
  apolla-master-key: {{ required "必须设置 secrets.masterKey（如 --set secrets.masterKey=$(openssl rand -hex 24)），或改用 secrets.existingSecret" .Values.secrets.masterKey | quote }}
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  s3-access-key: {{ .Values.secrets.s3AccessKey | quote }}
  s3-secret-key: {{ .Values.secrets.s3SecretKey | quote }}
  model-api-key: {{ .Values.secrets.modelApiKey | quote }}
{{- end }}
