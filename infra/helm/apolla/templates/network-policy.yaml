{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "apolla.fullname" . }}
# 网络策略（T-414）：最小放行。默认拒绝命名空间内一切入站，再逐条放开。
# 需要集群 CNI 支持 NetworkPolicy（Calico / Cilium / Antrea 等）。
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-default-deny
  labels:
    {{- include "apolla.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "apolla.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
---
# server：只接受 Ingress 控制器 / 指定命名空间的入站；出站到 pg/valkey/minio/litellm 与 DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-server
  labels:
    {{- include "apolla.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "apolla.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressFrom }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
      ports:
        - port: {{ .Values.server.service.port }}
    {{- if .Values.networkPolicy.metricsFrom }}
    - from:
        {{- range .Values.networkPolicy.metricsFrom }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
      ports:
        - port: {{ .Values.server.service.port }}
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "apolla.selectorLabels" . | nindent 14 }}
      # 同 release 内的 postgres / valkey / minio / litellm
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.serverEgressExtra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
# 数据服务：只接受 server（与留存/备份 Job）访问；沙箱任务 Pod 即使在同命名空间也连不上 pg
{{- range $comp := list "postgres" "valkey" "minio" "litellm" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-{{ $comp }}
  labels:
    {{- include "apolla.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "apolla.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $comp }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "apolla.selectorLabels" $ | nindent 14 }}
              app.kubernetes.io/component: server
        - podSelector:
            matchLabels:
              {{- include "apolla.selectorLabels" $ | nindent 14 }}
              app.kubernetes.io/component: ops
{{- end }}
---
# 沙箱任务 Pod（若启用 K8s Job 执行器）：完全无出网，只允许被 server 连（控制通道走 attach，不需要网络）
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-sandbox
  labels:
    {{- include "apolla.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: sandbox
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
{{- end }}
